<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>7 ème compagnie — La Réunion</title>
<meta name="description" content="Guide de 164 endroits à La Réunion.">
<meta name="theme-color" content="#009B9B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#16181A; --ink-2:#5A6167; --line:#E2E5E7; --bg:#FFFFFF; --bg-2:#F4F6F6;
  --lagon:#009B9B; --focus:#0B5D78;
  --tap:56px;
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:18px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:4px}

/* ---------- Crête : le profil de l'île, du lagon au piton ---------- */
.crest{display:block;width:100%;height:104px}
.masthead{padding:22px 20px 0}
.wordmark{
  margin:0; font-size:2.15rem; line-height:1.02; font-weight:800;
  letter-spacing:-.028em;
}
.wordmark .ord{font-weight:400; font-size:.62em; letter-spacing:0}
.standfirst{margin:9px 0 18px; color:var(--ink-2); font-size:1rem; max-width:34ch}

/* ---------- Recherche ---------- */
.searchbar{position:sticky; top:0; z-index:20; background:var(--bg); padding:10px 20px 12px;
  border-bottom:1px solid var(--line)}
.field{position:relative}
.field svg{position:absolute; left:16px; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--ink-2)}
#q{
  width:100%; height:var(--tap); padding:0 46px 0 50px;
  font-size:1.06rem; color:var(--ink);
  background:var(--bg-2); border:2px solid var(--line); border-radius:14px;
}
#q::placeholder{color:var(--ink-2)}
#q:focus{border-color:var(--focus); background:var(--bg); outline:none}
#clear{position:absolute; right:6px; top:50%; transform:translateY(-50%);
  width:44px; height:44px; border-radius:50%; color:var(--ink-2); font-size:1.5rem; line-height:1}
#clear[hidden]{display:none}

main{padding:20px 20px 44px}
body[data-view="list"] .crest,
body[data-view="list"] .masthead{display:none}
body[data-view="list"] main{padding-top:16px}

/* ---------- Accueil : les 9 étages ---------- */
.tiles{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:0; padding:0; list-style:none}
.tile{
  display:flex; flex-direction:column; justify-content:flex-start;
  min-height:132px; padding:14px; border-radius:16px;
  color:#fff; background:var(--c);
}
.tile:active{transform:scale(.985)}
.tile{position:relative}
.tile .ic{opacity:.92; margin-bottom:auto}
.tile .nm{display:block; font-weight:700; font-size:1.06rem; line-height:1.2; margin-top:12px; letter-spacing:-.012em}
.tile .sb{display:block; font-size:.84rem; opacity:.84; margin-top:3px; line-height:1.3}
.tile .ct{position:absolute; top:13px; right:15px; font-size:1.1rem; font-weight:700; opacity:.9; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.tiles > li:first-child{grid-column:1 / -1}
.tile--wide{min-height:0; flex-direction:row; align-items:center; gap:15px; padding:16px 15px}
.tile--wide .ic{margin:0}
.tile--wide .nm{margin:0}
.tile--wide .sb{margin:2px 0 0}
.tile--wide .txt{flex:1}
.tile--wide .ct{position:static; font-size:1.25rem}
.tile--wide .txt{display:block}

/* ---------- Vue catégorie ---------- */
.bar{display:flex; align-items:center; gap:12px; margin:-4px 0 16px}
.back{display:flex; align-items:center; gap:8px; height:var(--tap); padding:0 14px 0 8px;
  margin-left:-8px; border-radius:12px; font-weight:600; color:var(--ink-2)}
.back:active{background:var(--bg-2)}
.head{display:flex; align-items:center; gap:12px; margin:0 0 4px}
.head .chip{width:44px; height:44px; border-radius:12px; display:grid; place-items:center; color:#fff; background:var(--c); flex:none}
.head h2{margin:0; font-size:1.5rem; letter-spacing:-.02em; line-height:1.1}
.count{color:var(--ink-2); font-size:.95rem; margin:0 0 18px}

.places{list-style:none; margin:0; padding:0; border-top:1px solid var(--line)}
.place{border-bottom:1px solid var(--line)}
.place a{display:flex; align-items:center; gap:14px; min-height:var(--tap); padding:14px 2px}
.place a:active{background:var(--bg-2)}
.place .rule{width:4px; align-self:stretch; border-radius:2px; background:var(--c); flex:none}
.place .body{flex:1; min-width:0}
.place .n{display:block; font-weight:600; font-size:1.06rem; line-height:1.3}
.place .d{display:block; color:var(--ink-2); font-size:.94rem; margin-top:3px; line-height:1.4}
.place .go{flex:none; display:flex; align-items:center; gap:6px; color:var(--lagon); font-weight:700; font-size:.9rem}
.place .go svg{flex:none}

.empty{padding:40px 4px; color:var(--ink-2)}
.empty strong{display:block; color:var(--ink); font-size:1.15rem; margin-bottom:6px; font-weight:700}

.cat-label{display:block; font-size:.86rem; color:var(--ink-2); margin-top:2px}

footer{padding:26px 20px 40px; color:var(--ink-2); font-size:.86rem; border-top:1px solid var(--line); margin-top:10px}
footer p{margin:0 0 6px}

@media (min-width:620px){
  body{font-size:19px}
  .masthead,.searchbar,main,footer{max-width:660px; margin-inline:auto}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .wordmark{font-size:2.7rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

/* ---------- Ajouter un endroit ---------- */
.addbtn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
  min-height:var(--tap); margin-top:16px; border:2px dashed var(--line); border-radius:16px;
  color:var(--ink-2); font-weight:600; background:var(--bg-2)}
.addbtn:active{background:#EDF0F0}
.form{margin-top:4px}
.form label{display:block; margin-bottom:16px}
.form .lb{display:block; font-weight:600; margin-bottom:6px; font-size:1rem}
.form .hint{display:block; color:var(--ink-2); font-size:.88rem; font-weight:400; margin-top:2px}
.form input[type=text],.form select,.form textarea{
  width:100%; min-height:var(--tap); padding:12px 14px; font:inherit; color:var(--ink);
  background:var(--bg); border:2px solid var(--line); border-radius:12px}
.form textarea{min-height:88px; resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--focus); outline:none}
.gps{display:flex; align-items:center; justify-content:center; gap:9px; width:100%; min-height:var(--tap);
  border-radius:12px; background:var(--lagon); color:#fff; font-weight:700; margin-bottom:10px}
.gps:disabled{opacity:.6}
.or{text-align:center; color:var(--ink-2); font-size:.9rem; margin:10px 0}
.pos{display:block; margin:12px 0 0; padding:12px 14px; border-radius:12px; background:var(--bg-2);
  font-size:.95rem; color:var(--ink-2); min-height:48px}
.pos.ok{background:#E6F4F1; color:#0A5C48; font-weight:600}
.pos.ko{background:#FBE9E5; color:#8C2A11; font-weight:600}
.submit{width:100%; min-height:60px; border-radius:14px; background:var(--ink); color:#fff;
  font-weight:700; font-size:1.06rem; margin-top:6px}
.submit:disabled{background:#9AA1A6}
.mine{display:inline-block; margin-top:4px; font-size:.78rem; font-weight:700; color:var(--lagon)}
.del{flex:none; width:48px; height:48px; border-radius:12px; color:#8C2A11; background:#FBE9E5; font-size:1.3rem}
.note{color:var(--ink-2); font-size:.9rem; line-height:1.5; background:var(--bg-2); padding:14px;
  border-radius:12px; margin:0 0 18px}
.export{width:100%; min-height:var(--tap); border-radius:12px; border:2px solid var(--line);
  font-weight:600; margin-top:14px}
.export-out{width:100%; min-height:120px; margin-top:12px; font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:.8rem; padding:12px; border:2px solid var(--line); border-radius:12px}
/* Le bas de l'ecran appartient a la barre de navigation gestuelle du telephone :
   un bouton pose la-dedans s'affiche mais ne recoit jamais le doigt. D'ou le
   env(safe-area-inset-bottom), et une marge large. Constate sur le telephone
   de Vincent le 06/09/2026 — invisible en test sur navigateur de bureau. */
#maj-zone{position:fixed; left:12px; right:12px; z-index:50;
  bottom:calc(64px + env(safe-area-inset-bottom, 0px))}
.maj{position:relative; width:100%; display:flex; gap:12px; align-items:center; justify-content:space-between;
  background:var(--lagon,#009B9B); color:#fff; padding:16px; border-radius:14px;
  box-shadow:0 6px 24px rgba(0,0,0,.28); font-weight:600;
  border:0; text-align:left; font-size:1rem; font-family:inherit;
  cursor:pointer; -webkit-tap-highlight-color:rgba(255,255,255,.25)}
.maj .cta{flex:none; min-height:48px; display:flex; align-items:center; padding:0 18px;
  border-radius:10px; background:#fff; color:#00696B; font-weight:800; pointer-events:none}
/* Toujours offrir une sortie : un bandeau qu'on ne peut pas fermer et dont le
   bouton ne repond pas laisse l'ecran bloque, sans aucun recours. */
.maj-x{position:absolute; z-index:51; top:-12px; right:-6px; width:36px; height:36px; border:0;
  border-radius:50%; background:#fff; color:#00696B; font-size:1.2rem; font-weight:800;
  box-shadow:0 2px 8px rgba(0,0,0,.3); line-height:1}
/* Le bandeau est fixe : sans cette reserve, il masque la fin de la page. */
body[data-maj] footer{padding-bottom:120px}
.ver{margin-top:10px; font-size:.78rem; opacity:.65}

/* ======================= Secteurs de l'île ======================= */
.secteurs{display:flex; gap:8px; overflow-x:auto; padding:2px 20px 12px;
  -webkit-overflow-scrolling:touch; scrollbar-width:none}
.secteurs::-webkit-scrollbar{display:none}
.sec{flex:none; min-height:42px; padding:0 16px; border-radius:21px; border:2px solid var(--line);
  background:var(--bg); color:var(--ink-2); font-weight:700; font-size:.95rem; font-family:inherit;
  white-space:nowrap; display:flex; align-items:center; gap:6px}
.sec[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
.sec .n{font-size:.8rem; opacity:.7; font-weight:600}
.sec[aria-pressed="true"] .n{opacity:.85}

/* ======================= Actions sur un lieu ======================= */
.acts{display:flex; gap:8px; padding:0 14px 14px; align-items:stretch}
.act{flex:1; min-height:48px; display:flex; align-items:center; justify-content:center; gap:7px;
  border-radius:12px; border:2px solid var(--line); background:var(--bg); color:var(--ink);
  font-weight:700; font-size:.92rem; font-family:inherit; text-decoration:none}
/* Couleur FIXE et foncee, pas celle de la categorie : certaines categories
   sont trop claires pour porter du texte blanc (« Courses » tombait a 3,9:1,
   sous le minimum lisible de 4,5:1). Un guide qui se lit en plein soleil
   tropical n'a pas les moyens d'un contraste juste acceptable. La couleur de
   la categorie reste visible sur la barre laterale du lieu. */
.act--go{background:#1E4A2B; border-color:#1E4A2B; color:#fff}
.act--fav{flex:none; width:52px; padding:0; font-size:1.35rem; line-height:1}
.act--fav[aria-pressed="true"]{background:#FFF3D1; border-color:#E8B21F; color:#B8860B}
.act--note[data-rempli="1"]{background:#EAF4F4; border-color:var(--lagon,#009B9B); color:#00696B}

/* ======================= Panneau de note ======================= */
.notez{padding:0 14px 14px}
.notez textarea{width:100%; min-height:88px; padding:12px; border:2px solid var(--line);
  border-radius:12px; font-family:inherit; font-size:1rem; line-height:1.45; background:var(--bg)}
.partage{display:flex; align-items:center; gap:10px; margin-top:10px; padding:12px;
  background:var(--bg-2); border-radius:12px}
.partage input{width:24px; height:24px; flex:none; accent-color:var(--lagon,#009B9B)}
.partage label{font-size:.9rem; line-height:1.4; color:var(--ink-2)}
.notez .rangee{display:flex; gap:8px; margin-top:10px}
.notez .rangee button{flex:1; min-height:46px; border-radius:11px; border:2px solid var(--line);
  background:var(--bg); font-weight:700; font-family:inherit; font-size:.92rem}
/* Meme piege de specificite que dans Eglantine : « .notez .rangee button »
   (0-2-1) l'emportait sur « .notez .enr » (0-2-0), et le bouton Enregistrer
   s'affichait en blanc sur fond clair — invisible. Vu sur le telephone de
   Vincent le 06/09/2026. */
.notez .rangee button.enr{background:var(--ink); border-color:var(--ink); color:#fff}

/* ======================= Épervier — l'envoi ======================= */
.epervier{margin:0 20px 18px; padding:16px; border-radius:14px; background:#EAF4F4;
  border:2px solid var(--lagon,#009B9B)}
.epervier .t{font-weight:800; color:#00696B; margin-bottom:4px}
.epervier .s{font-size:.88rem; color:var(--ink-2); line-height:1.45}
.epervier button{width:100%; min-height:50px; margin-top:12px; border:0; border-radius:12px;
  background:var(--lagon,#009B9B); color:#fff; font-weight:800; font-size:1rem; font-family:inherit}
.epervier button:disabled{background:#9AA1A6}
.epervier .etat{margin-top:10px; font-size:.88rem; font-weight:600; line-height:1.4}
.etat--ok{color:#1E6B33} .etat--ko{color:#8C2A11}

/* ======================= Retour en haut ======================= */
.haut{position:fixed; right:16px; z-index:40; width:52px; height:52px; border-radius:50%;
  bottom:calc(20px + env(safe-area-inset-bottom, 0px));
  border:0; background:var(--ink); color:#fff; font-size:1.3rem; line-height:1;
  box-shadow:0 4px 16px rgba(0,0,0,.3)}

/* ======================= Urgences ======================= */
.urgences{margin:0 20px 20px; padding:16px; border-radius:14px;
  background:#FBE9E5; border:2px solid #B32D12}
.urgences h3{margin:0 0 4px; font-size:1rem; color:#8C2A11; letter-spacing:.02em}
.urgences p{margin:0 0 12px; font-size:.86rem; color:var(--ink-2); line-height:1.4}
.urg-grille{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.urg{display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:74px; border-radius:12px; background:#B32D12; color:#fff; text-decoration:none;
  font-weight:800; line-height:1.15}
.urg .num{font-size:1.6rem}
.urg .qui{font-size:.78rem; font-weight:600; opacity:.95; margin-top:2px}

/* ======================= Autour de moi ======================= */
.dist{display:inline-block; margin-top:4px; font-size:.8rem; font-weight:700; color:var(--lagon,#009B9B)}
</style>
</head>

<header class="masthead">

</header>

<div class="searchbar">
  <div class="field">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>

<div class="secteurs" id="secteurs" role="group" aria-label="Filtrer par secteur"></div>

<main id="app" tabindex="-1"></main>

<div id="maj-zone" hidden>
  <button id="maj" class="maj" type="button" onclick="location.reload()">
    <span>Nouvelle version disponible</span>
    <span class="cta">Mettre &agrave; jour</span>
  </button>
  <button id="maj-x" class="maj-x" type="button" aria-label="Fermer">&times;</button>
</div>

<footer>
  <p>Fonctionne sans réseau une fois installé.</p>
  <p>Pour l’itinéraire hors connexion, téléchargez la carte de La Réunion dans Google Maps : profil → Plans hors connexion.</p>
  <p class="ver">version <span id="ver"></span></p>
</footer>

/* ===================== Distance ===================== */
function distKm(a, b){
  const R = 6371, r = Math.PI/180;
  const dLa = (b.lat-a.lat)*r, dLo = (b.lng-a.lng)*r;
  const h = Math.sin(dLa/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const jolieDist = d => d < 1 ? Math.round(d*1000) + ' m' : d.toFixed(d<10?1:0) + ' km';

  DATA.forEach(c => { c.l = c.l.filter(p => !p.mine); });
  loadAdds().forEach(p => {
    const c = DATA.find(x => x.s === p.s);
    if(!c) return;
    c.l.push({ n:p.n, d:p.d||'', lat:p.lat, lng:p.lng, k:fold((p.n+' '+(p.d||''))), mine:true, id:p.id });
  });
  DATA.forEach(c => c.l.sort((a,b) => a.n.localeCompare(b.n, 'fr')));
}

/* Accepte un lien Google Maps, ou simplement "lat, lng" */
function coordsFrom(txt){
  if(!txt) return null;
  const pats = [/@(-?\d+\.\d+),(-?\d+\.\d+)/, /[?&]query=(-?\d+\.\d+),(-?\d+\.\d+)/,
                /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/, /(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/];
  for(const re of pats){
    const m = txt.match(re);
    if(m){
      let lat = parseFloat(m[1]), lng = parseFloat(m[2]);
      /* La Réunion : latitude ~ -21, longitude ~ 55. Si c'est inversé, on remet d'aplomb. */
      if(lat > 50 && lng < 0){ const t = lat; lat = lng; lng = t; }
      if(isFinite(lat) && isFinite(lng)) return { lat:+lat.toFixed(6), lng:+lng.toFixed(6) };
    }
  }
  return null;
}

      <button type="button" class="gps" id="f-gps">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
        Je suis sur place, prendre ma position</button>
      <p class="or">ou collez un lien Google Maps</p>
      <label><input type="text" id="f-u" autocomplete="off" placeholder="https://maps.google.com/…" inputmode="url"></label>
      <output class="pos" id="f-p">Aucune position pour l'instant.</output>
      <button type="submit" class="submit" id="f-s" disabled>Enregistrer l'endroit</button>
    </form>`;

  const el = id => document.getElementById(id);
  let pos = null;
  const setPos = (p, msg, cls) => {
    pos = p; const o = el('f-p');
    o.className = 'pos' + (cls ? ' ' + cls : '');
    o.textContent = msg;
    el('f-s').disabled = !(p && el('f-n').value.trim());
  };

  el('f-n').addEventListener('input', () => { el('f-s').disabled = !(pos && el('f-n').value.trim()); });

  el('f-u').addEventListener('input', e => {
    const v = e.target.value.trim();
    if(!v) return setPos(null, 'Aucune position pour l\'instant.');
    const c = coordsFrom(v);
    if(!c){
      const court = /goo\.gl|maps\.app|bit\.ly/.test(v);
      return setPos(null, court
        ? "Ce lien raccourci ne contient pas la position. Dans Google Maps, appuyez quelques secondes sur le lieu : ses coordonnées s'affichent en haut de l'écran. Copiez-les et collez-les ici."
        : "Pas de position dans ce texte. Collez un lien Google Maps, ou deux nombres séparés par une virgule.", 'ko');
    }
    setPos(c, dansLIle(c) ? `Position trouvée : ${c.lat}, ${c.lng}`
                          : `Position trouvée : ${c.lat}, ${c.lng} — attention, ce point n'est pas à La Réunion.`,
           dansLIle(c) ? 'ok' : 'ko');
  });

  el('f-gps').addEventListener('click', () => {
    if(!navigator.geolocation) return setPos(null, "Ce téléphone ne sait pas donner sa position.", 'ko');
    const b = el('f-gps'); b.disabled = true;
    setPos(null, 'Recherche de la position…');
    navigator.geolocation.getCurrentPosition(
      r => { b.disabled = false;
             const c = { lat:+r.coords.latitude.toFixed(6), lng:+r.coords.longitude.toFixed(6) };
             setPos(c, `Position prise ici : ${c.lat}, ${c.lng}`, 'ok'); },
      e => { b.disabled = false;
             setPos(null, e.code === 1 ? "Position refusée. Autorisez la localisation, ou collez un lien Google Maps."
                                       : "Position introuvable. Sortez à l'air libre, ou collez un lien Google Maps.", 'ko'); },
      { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
  });

  el('fadd').addEventListener('submit', e => {
    e.preventDefault();
    const n = el('f-n').value.trim();
    if(!n || !pos) return;
    const a = loadAdds();
    a.push({ id:'a' + Date.now(), n, d:el('f-d').value.trim(), s:el('f-c').value, lat:pos.lat, lng:pos.lng });
    if(!saveAdds(a)) return setPos(pos, "Enregistrement impossible : la mémoire du navigateur est pleine ou bloquée.", 'ko');
    mergeAdds();
    location.hash = '#/' + el('f-c').value;
  });
}

function renderMine(){
  document.body.dataset.view = 'list';
  const a = loadAdds();
  const rows = a.map(p => {
    const c = DATA.find(x => x.s === p.s);
    return `<li class="place" style="--c:${c ? c.col : '#666'}">
      <div style="display:flex;align-items:center;gap:14px;padding:14px 2px">
        <span class="rule"></span>
        <span class="body"><span class="n">${esc(p.n)}</span>
          ${p.d ? `<span class="d">${esc(p.d)}</span>` : ''}
          <span class="d cat-label">${c ? esc(c.t) : '—'}</span></span>
        <button class="del" data-id="${p.id}" aria-label="Supprimer ${esc(p.n)}">&times;</button>
      </div></li>`; }).join('');
  app.innerHTML = `
    <div class="bar"><a class="back" href="#/">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H6M12 6l-6 6 6 6"/></svg>
      Tous les endroits</a></div>
    <div class="head"><h2>Mes ajouts</h2></div>
    ${a.length
      ? `<p class="count">${a.length} endroit${a.length>1?'s':''} enregistré${a.length>1?'s':''} dans ce téléphone</p>
         <ul class="places">${rows}</ul>
         <button class="export" id="exp">Préparer l'envoi à Vincent</button>
         <textarea class="export-out" id="expout" hidden readonly aria-label="À envoyer à Vincent"></textarea>`
      : `<div class="empty"><strong>Aucun ajout pour l'instant</strong>
         Les endroits que vous ajoutez apparaîtront ici, et vous pourrez les envoyer à Vincent.</div>`}`;

  app.querySelectorAll('.del').forEach(b => b.addEventListener('click', () => {
    saveAdds(loadAdds().filter(x => x.id !== b.dataset.id));
    mergeAdds(); renderMine();
  }));
  const exp = document.getElementById('exp');
  if(exp) exp.addEventListener('click', () => {
    const t = document.getElementById('expout');
    t.hidden = false;
    t.value = JSON.stringify(loadAdds(), null, 1);
    t.select();
    try { navigator.clipboard.writeText(t.value); exp.textContent = 'Copié — collez-le dans un message à Vincent'; }
    catch(e){ exp.textContent = 'Sélectionnez le texte ci-dessous et copiez-le'; }
  });
}


/* ===================== ÉPERVIER — l'envoi des notes =====================
   « Allo Eglantine, ici Epervier. » Le terrain appelle le QG.

   Ce module n'envoie QUE les notes cochees « Partager avec Vincent ». Une note
   privee ne sort jamais de l'appareil, par construction : elle n'entre meme pas
   dans le message.

   Eglantine est joignable uniquement par Tailscale — rien n'est expose sur
   Internet. Si le telephone n'est pas sur le tailnet, ou si Trixie dort,
   l'envoi echoue proprement et les notes restent en attente : on ne les
   marque comme transmises que si le serveur a repondu.                     */
const EGLANTINE = 'https://trixie-famille.tail21776a.ts.net:17443';
const LS_QUI = '7c-qui';

/* Retrouve le nom d'un lieu a partir de son identifiant. */
function nomDuLieu(id){
  for (const c of DATA) for (const p of c.l) if (pid(p) === id) return p.n;
  return '(lieu inconnu)';
}

function blocEpervier(n){
  const qui = localStorage.getItem(LS_QUI) || '';
  return `<section class="epervier">
    <div class="t">${n} note${n>1?'s':''} à envoyer à Vincent</div>
    <div class="s">Vos notes marquées « à partager ». Les notes privées ne sont pas concernées.</div>
    ${qui ? '' : `<div class="rangee" style="margin-top:10px">
      <input id="ep-qui" type="text" placeholder="Votre prénom" autocomplete="given-name"
             style="width:100%; min-height:46px; padding:0 12px; border:2px solid var(--line); border-radius:11px; font-family:inherit; font-size:1rem">
    </div>`}
    <button type="button" id="ep-go">Envoyer</button>
    <div class="etat" id="ep-etat" hidden></div>
  </section>`;
}

function brancherEpervier(){
  const bouton = document.getElementById('ep-go');
  const etat = document.getElementById('ep-etat');
  const dire = (txt, ok) => { etat.hidden = false; etat.textContent = txt;
                              etat.className = 'etat ' + (ok ? 'etat--ok' : 'etat--ko'); };

  bouton.addEventListener('click', async () => {
    const champ = document.getElementById('ep-qui');
    const qui = (champ ? champ.value.trim() : '') || localStorage.getItem(LS_QUI) || '';
    if (!qui) { dire("Indiquez votre prénom, pour que Vincent sache qui écrit.", false);
                if (champ) champ.focus(); return; }
    try { localStorage.setItem(LS_QUI, qui); } catch(e){}

    const lot = aEnvoyer();
    if (!lot.length) { dire("Rien à envoyer.", true); return; }

    bouton.disabled = true; dire("Envoi en cours…", true);
    const message = {
      de: qui,
      version: VERSION,
      envoye: new Date().toISOString(),
      notes: lot.map(([id, n]) => ({ id, lieu: nomDuLieu(id), texte: n.txt, ecrite: n.maj }))
    };

    try {
      const ctrl = new AbortController();
      const minuteur = setTimeout(() => ctrl.abort(), 12000);
      const r = await fetch(EGLANTINE + '/epervier', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(message), signal: ctrl.signal
      });
      clearTimeout(minuteur);
      if (!r.ok) throw new Error('HTTP ' + r.status);

      /* Marquees transmises SEULEMENT maintenant : le serveur a confirme. */
      const t = Date.now();
      lot.forEach(([id]) => { NOTES[id].env = t; });
      ecrire(LS_NOTES, NOTES);
      dire(`✓ ${lot.length} note${lot.length>1?'s':''} envoyée${lot.length>1?'s':''} à Vincent.`, true);
      setTimeout(route, 1800);
    } catch (e) {
      bouton.disabled = false;
      dire("Envoi impossible pour l'instant. Vos notes sont gardées, réessayez quand vous aurez du réseau.", false);
    }
  });
}

function placeItem(p, cat, showCat, dist){
  const id = pid(p), n = noteDe(p);
  return `<li class="place" style="--c:${cat.col}">
    <a href="${mapsUrl(p)}" rel="noreferrer">
      <span class="rule"></span>
      <span class="body">
        <span class="n">${esc(p.n)}</span>
        ${p.d ? `<span class="d">${esc(p.d)}</span>` : ''}
        ${showCat ? `<span class="d cat-label">${esc(cat.t)}</span>` : ''}
        ${dist != null ? `<span class="dist">à ${jolieDist(dist)}</span>` : ''}
        ${p.mine ? '<span class="mine">Ajouté par vous</span>' : ''}
      </span>
      <span class="go">Voir <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span>
    </a>
    <div class="acts">
      <button class="act act--fav" type="button" data-fav="${id}" aria-pressed="${estFav(p)}"
              aria-label="Mettre en favori">${estFav(p) ? '★' : '☆'}</button>
      <a class="act act--go" href="${itiUrl(p)}" rel="noreferrer">Itinéraire</a>
      <button class="act act--note" type="button" data-note="${id}" data-rempli="${aNote(p) ? 1 : 0}">
        ${aNote(p) ? 'Ma note' : 'Note'}</button>
    </div>
    <div class="notez" id="nz-${id}" hidden>
      <textarea id="tx-${id}" placeholder="Ce que vous voulez retenir sur cet endroit…">${esc(n ? n.txt : '')}</textarea>
      <div class="partage">
        <input type="checkbox" id="pb-${id}" ${n && n.pub ? 'checked' : ''}>
        <label for="pb-${id}">Partager avec Vincent.<br>Sinon la note reste dans ce téléphone, elle n'est jamais envoyée.</label>
      </div>
      <div class="rangee">
        <button type="button" class="enr" data-enr="${id}">Enregistrer</button>
        <button type="button" data-sup="${id}">Supprimer</button>
      </div>
    </div>
  </li>`;
}

/* Les ecrans sont regeneres a chaque affichage : on rebranche les actions. */
function brancherActions(){
  app.querySelectorAll('[data-fav]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.fav, i = FAV.indexOf(id);
    if (i < 0) FAV.push(id); else FAV.splice(i,1);
    ecrire(LS_FAV, FAV);
    b.setAttribute('aria-pressed', i < 0); b.textContent = i < 0 ? '★' : '☆';
  }));
  app.querySelectorAll('[data-note]').forEach(b => b.addEventListener('click', () => {
    const z = document.getElementById('nz-' + b.dataset.note);
    z.hidden = !z.hidden;
    if (!z.hidden) document.getElementById('tx-' + b.dataset.note).focus();
  }));
  app.querySelectorAll('[data-enr]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.enr;
    const txt = document.getElementById('tx-' + id).value.trim();
    const pub = document.getElementById('pb-' + id).checked;
    if (!txt) { delete NOTES[id]; }
    else {
      const av = NOTES[id] || {};
      /* Le texte a change : la note redevient « a envoyer ». */
      NOTES[id] = { txt, pub, maj: Date.now(), env: (av.txt === txt && av.pub === pub) ? av.env : null };
    }
    ecrire(LS_NOTES, NOTES);
    route();
  }));
  app.querySelectorAll('[data-sup]').forEach(b => b.addEventListener('click', () => {
    delete NOTES[b.dataset.sup]; ecrire(LS_NOTES, NOTES); route();
  }));
}

function listeLieux(hits, showCat){
  return `<ul class="places">${hits.map(h => placeItem(h[0], h[1], showCat, h[2])).join('')}</ul>`;
}

function renderHome(){
  document.body.dataset.view = 'home';
  const cats = DATA.map(c => [c, c.l.filter(passe).length]).filter(([,n]) => n > 0);
  const nFav = FAV.length, env = aEnvoyer().length;

  app.innerHTML =
    (env ? blocEpervier(env) : '') +
    `<ul class="tiles">` + cats.map(([c,n],i) => {
      const wide = i === 0;
      return `<li><a class="tile ${wide?'tile--wide':''}" style="--c:${c.col}" href="#/${c.s}">
        ${svg(ICONS[c.s], wide?30:26)}
        <span class="${wide?'txt':''}"><span class="nm">${esc(c.t)}</span><span class="sb">${esc(c.sub)}</span></span>
        <span class="ct">${n}</span></a></li>`;
    }).join('') + `</ul>` +
    (cats.length ? '' : `<div class="empty"><strong>Aucun endroit dans ce secteur</strong>Touchez « Tous » au-dessus pour tout revoir.</div>`) +
    `<button class="addbtn" type="button" onclick="location.hash='#/autour'">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      Autour de moi</button>` +
    (nFav ? `<button class="addbtn" type="button" onclick="location.hash='#/favoris'">★ Mes endroits (${nFav})</button>` : '') +
    `<button class="addbtn" type="button" onclick="location.hash='#/ajouter'">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Ajouter un endroit</button>` +
    (loadAdds().length ? `<button class="addbtn" type="button" onclick="location.hash='#/mesajouts'">Mes ajouts (${loadAdds().length})</button>` : '');

  if (env) brancherEpervier();
}

function barre(titre){
  return `<div class="bar"><a class="back" href="#/">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H6M12 6l-6 6 6 6"/></svg>
    ${esc(titre)}</a></div>`;
}

function renderCat(slug){
  const c = DATA.find(x => x.s === slug);
  if(!c) return renderHome();
  document.body.dataset.view = 'list';
  const lieux = c.l.filter(passe);
  app.innerHTML = barre('Tous les endroits') +
    `<div class="head" style="--c:${c.col}"><span class="chip">${svg(ICONS[c.s],24)}</span><h2>${esc(c.t)}</h2></div>` +
    (c.s === 'sante' ? blocUrgences() : '') +
    `<p class="count">${lieux.length} endroit${lieux.length>1?'s':''}${SECTEUR ? ' · ' + SECTEURS.find(x=>x[0]===SECTEUR)[1] : ' · ' + esc(c.sub)}</p>` +
    (lieux.length ? listeLieux(lieux.map(p => [p,c,null]), false)
                  : `<div class="empty"><strong>Rien dans ce secteur</strong>Touchez « Tous » en haut de l'écran.</div>`);
  brancherActions();
}

function renderSearch(term){
  document.body.dataset.view = 'list';
  const t = fold(term);
  const hits = [];
  DATA.forEach(c => c.l.forEach(p => { if(passe(p) && p.k.includes(t)) hits.push([p,c,null]); }));
  if(!hits.length){
    app.innerHTML = `<div class="empty"><strong>Rien trouvé pour « ${esc(term)} »</strong>
      Essayez un mot plus court${SECTEUR ? ', ou touchez « Tous » pour chercher dans toute l\'île' : ''}.</div>`;
    return;
  }
  app.innerHTML = `<p class="count">${hits.length} résultat${hits.length>1?'s':''}</p>` + listeLieux(hits, true);
  brancherActions();
}

function renderFavoris(){
  document.body.dataset.view = 'list';
  const hits = [];
  DATA.forEach(c => c.l.forEach(p => { if(estFav(p)) hits.push([p,c,null]); }));
  app.innerHTML = barre('Tous les endroits') +
    `<div class="head" style="--c:#E8B21F"><span class="chip">★</span><h2>Mes endroits</h2></div>` +
    (hits.length ? `<p class="count">${hits.length} favori${hits.length>1?'s':''}</p>` + listeLieux(hits, true)
                 : `<div class="empty"><strong>Aucun favori</strong>Touchez l'étoile d'un endroit pour le retrouver ici.</div>`);
  brancherActions();
}

/* Le GPS n'a pas besoin de reseau : « autour de moi » marche hors ligne. */
function renderAutour(){
  document.body.dataset.view = 'list';
  const dessine = () => {
    const hits = [];
    DATA.forEach(c => c.l.forEach(p => { if(passe(p)) hits.push([p, c, distKm(POS, p)]); }));
    hits.sort((a,b) => a[2] - b[2]);
    const top = hits.slice(0, 20);
    app.innerHTML = barre('Tous les endroits') +
      `<div class="head" style="--c:#009B9B"><span class="chip">◎</span><h2>Autour de moi</h2></div>
       <p class="count">Les ${top.length} endroits les plus proches</p>` + listeLieux(top, true);
    brancherActions();
  };
  if (POS) return dessine();
  app.innerHTML = barre('Tous les endroits') +
    `<div class="head" style="--c:#009B9B"><span class="chip">◎</span><h2>Autour de moi</h2></div>
     <p class="note" id="gps-etat">Recherche de votre position…</p>`;
  if (!navigator.geolocation) {
    document.getElementById('gps-etat').textContent = "Ce téléphone ne donne pas la position.";
    return;
  }
  navigator.geolocation.getCurrentPosition(
    r => { POS = { lat: r.coords.latitude, lng: r.coords.longitude }; dessine(); },
    () => { const e = document.getElementById('gps-etat');
            if (e) e.textContent = "Position indisponible. Vérifiez que la localisation est activée, puis réessayez."; },
    { enableHighAccuracy:true, timeout:12000, maximumAge:60000 }
  );
}

function route(){
  if(q.value.trim()){ renderSearch(q.value); return; }
  const m = location.hash.match(/^#\/(.+)$/);
  if(!m) return renderHome();
  if(m[1] === 'ajouter')   return renderAdd();
  if(m[1] === 'mesajouts') return renderMine();
  if(m[1] === 'favoris')   return renderFavoris();
  if(m[1] === 'autour')    return renderAutour();
  renderCat(m[1]);
}

/* Les cles de recherche sont recalculees ici : le fold gere desormais œ/æ,
   et les cles figees dans les donnees ne le savaient pas. */
DATA.forEach(c => c.l.forEach(p => { p.k = fold(p.n + ' ' + (p.d || '')); }));

mergeAdds();

q.addEventListener('input', () => { clearBtn.hidden = !q.value; route(); });
clearBtn.addEventListener('click', () => { q.value=''; clearBtn.hidden=true; q.focus(); route(); });
window.addEventListener('hashchange', () => { route(); window.scrollTo(0,0); });

/* Retour en haut : les listes montent jusqu'a une cinquantaine de lieux,
   remonter au pouce est long. */
const btnHaut = document.getElementById('haut');
addEventListener('scroll', () => { btnHaut.hidden = scrollY < 600; }, { passive:true });
btnHaut.addEventListener('click', () => window.scrollTo({ top:0, behavior:'smooth' }));

renderSecteurs();
route();

document.getElementById('ver').textContent = VERSION;
document.getElementById('maj-x').addEventListener('click', () => {
  document.getElementById('maj-zone').hidden = true;
  delete document.body.dataset.maj;
});

/* Detection de mise a jour. Sans ce bandeau, une nouvelle version ne s'affiche
   qu'a la DEUXIEME ouverture de l'app (comportement normal des PWA), ce qui
   donne l'impression que la mise a jour n'a pas eu lieu. */
if('serviceWorker' in navigator){
  const dejaInstalle = !!navigator.serviceWorker.controller;
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if(!sw) return;
        sw.addEventListener('statechange', () => {
          if(sw.state === 'installed' && dejaInstalle){
            const z = document.getElementById('maj-zone');
            if(z){ z.hidden = false; document.body.dataset.maj = '1'; }
          }
        });
      });
    }).catch(() => {});   /* hors ligne au premier chargement : sans consequence */
  });
}
</script>
