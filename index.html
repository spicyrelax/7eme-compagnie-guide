<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#16181A; --ink-2:#5A6167; --line:#E2E5E7; --bg:#FFFFFF; --bg-2:#F4F6F6;
  --lagon:#009B9B; --focus:#0B5D78;
  --tap:56px;
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:18px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:4px}

/* ---------- Crête : le profil de l'île, du lagon au piton ---------- */
.crest{display:block;width:100%;height:104px}
.masthead{padding:22px 20px 0}
.wordmark{
  margin:0; font-size:2.15rem; line-height:1.02; font-weight:800;
  letter-spacing:-.028em;
}
.wordmark .ord{font-weight:400; font-size:.62em; letter-spacing:0}
.standfirst{margin:9px 0 18px; color:var(--ink-2); font-size:1rem; max-width:34ch}

/* ---------- Recherche ---------- */
.searchbar{position:sticky; top:0; z-index:20; background:var(--bg); padding:10px 20px 12px;
  border-bottom:1px solid var(--line)}
.field{position:relative}
.field svg{position:absolute; left:16px; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--ink-2)}
#q{
  width:100%; height:var(--tap); padding:0 46px 0 50px;
  font-size:1.06rem; color:var(--ink);
  background:var(--bg-2); border:2px solid var(--line); border-radius:14px;
}
#q::placeholder{color:var(--ink-2)}
#q:focus{border-color:var(--focus); background:var(--bg); outline:none}
#clear{position:absolute; right:6px; top:50%; transform:translateY(-50%);
  width:44px; height:44px; border-radius:50%; color:var(--ink-2); font-size:1.5rem; line-height:1}
#clear[hidden]{display:none}

main{padding:20px 20px 44px}
body[data-view="list"] .crest,
body[data-view="list"] .masthead{display:none}
body[data-view="list"] main{padding-top:16px}

/* ---------- Accueil : les 9 étages ---------- */
.tiles{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:0; padding:0; list-style:none}
.tile{
  display:flex; flex-direction:column; justify-content:flex-start;
  min-height:132px; padding:14px; border-radius:16px;
  color:#fff; background:var(--c);
}
.tile:active{transform:scale(.985)}
.tile{position:relative}
.tile .ic{opacity:.92; margin-bottom:auto}
.tile .nm{display:block; font-weight:700; font-size:1.06rem; line-height:1.2; margin-top:12px; letter-spacing:-.012em}
.tile .sb{display:block; font-size:.84rem; opacity:.84; margin-top:3px; line-height:1.3}
.tile .ct{position:absolute; top:13px; right:15px; font-size:1.1rem; font-weight:700; opacity:.9; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.tiles > li:first-child{grid-column:1 / -1}
.tile--wide{min-height:0; flex-direction:row; align-items:center; gap:15px; padding:16px 15px}
.tile--wide .ic{margin:0}
.tile--wide .nm{margin:0}
.tile--wide .sb{margin:2px 0 0}
.tile--wide .txt{flex:1}
.tile--wide .ct{position:static; font-size:1.25rem}
.tile--wide .txt{display:block}

/* ---------- Vue catégorie ---------- */
.bar{display:flex; align-items:center; gap:12px; margin:-4px 0 16px}
.back{display:flex; align-items:center; gap:8px; height:var(--tap); padding:0 14px 0 8px;
  margin-left:-8px; border-radius:12px; font-weight:600; color:var(--ink-2)}
.back:active{background:var(--bg-2)}
.head{display:flex; align-items:center; gap:12px; margin:0 0 4px}
.head .chip{width:44px; height:44px; border-radius:12px; display:grid; place-items:center; color:#fff; background:var(--c); flex:none}
.head h2{margin:0; font-size:1.5rem; letter-spacing:-.02em; line-height:1.1}
.count{color:var(--ink-2); font-size:.95rem; margin:0 0 18px}

.places{list-style:none; margin:0; padding:0; border-top:1px solid var(--line)}
.place{border-bottom:1px solid var(--line)}
.place a{display:flex; align-items:center; gap:14px; min-height:var(--tap); padding:14px 2px}
.place a:active{background:var(--bg-2)}
.place .rule{width:4px; align-self:stretch; border-radius:2px; background:var(--c); flex:none}
.place .body{flex:1; min-width:0}
.place .n{display:block; font-weight:600; font-size:1.06rem; line-height:1.3}
.place .d{display:block; color:var(--ink-2); font-size:.94rem; margin-top:3px; line-height:1.4}
.place .go{flex:none; display:flex; align-items:center; gap:6px; color:var(--lagon); font-weight:700; font-size:.9rem}
.place .go svg{flex:none}

.empty{padding:40px 4px; color:var(--ink-2)}
.empty strong{display:block; color:var(--ink); font-size:1.15rem; margin-bottom:6px; font-weight:700}

.cat-label{display:block; font-size:.86rem; color:var(--ink-2); margin-top:2px}

footer{padding:26px 20px 40px; color:var(--ink-2); font-size:.86rem; border-top:1px solid var(--line); margin-top:10px}
footer p{margin:0 0 6px}

@media (min-width:620px){
  body{font-size:19px}
  .masthead,.searchbar,main,footer{max-width:660px; margin-inline:auto}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .wordmark{font-size:2.7rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

/* ---------- Ajouter un endroit ---------- */
.addbtn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
  min-height:var(--tap); margin-top:16px; border:2px dashed var(--line); border-radius:16px;
  color:var(--ink-2); font-weight:600; background:var(--bg-2)}
.addbtn:active{background:#EDF0F0}
.form{margin-top:4px}
.form label{display:block; margin-bottom:16px}
.form .lb{display:block; font-weight:600; margin-bottom:6px; font-size:1rem}
.form .hint{display:block; color:var(--ink-2); font-size:.88rem; font-weight:400; margin-top:2px}
.form input[type=text],.form select,.form textarea{
  width:100%; min-height:var(--tap); padding:12px 14px; font:inherit; color:var(--ink);
  background:var(--bg); border:2px solid var(--line); border-radius:12px}
.form textarea{min-height:88px; resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--focus); outline:none}
.gps{display:flex; align-items:center; justify-content:center; gap:9px; width:100%; min-height:var(--tap);
  border-radius:12px; background:var(--lagon); color:#fff; font-weight:700; margin-bottom:10px}
.gps:disabled{opacity:.6}
.or{text-align:center; color:var(--ink-2); font-size:.9rem; margin:10px 0}
.pos{display:block; margin:12px 0 0; padding:12px 14px; border-radius:12px; background:var(--bg-2);
  font-size:.95rem; color:var(--ink-2); min-height:48px}
.pos.ok{background:#E6F4F1; color:#0A5C48; font-weight:600}
.pos.ko{background:#FBE9E5; color:#8C2A11; font-weight:600}
.submit{width:100%; min-height:60px; border-radius:14px; background:var(--ink); color:#fff;
  font-weight:700; font-size:1.06rem; margin-top:6px}
.submit:disabled{background:#9AA1A6}
.mine{display:inline-block; margin-top:4px; font-size:.78rem; font-weight:700; color:var(--lagon)}
.del{flex:none; width:48px; height:48px; border-radius:12px; color:#8C2A11; background:#FBE9E5; font-size:1.3rem}
.note{color:var(--ink-2); font-size:.9rem; line-height:1.5; background:var(--bg-2); padding:14px;
  border-radius:12px; margin:0 0 18px}
.export{width:100%; min-height:var(--tap); border-radius:12px; border:2px solid var(--line);
  font-weight:600; margin-top:14px}
.export-out{width:100%; min-height:120px; margin-top:12px; font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:.8rem; padding:12px; border:2px solid var(--line); border-radius:12px}
</style>

const saveAdds = a => { try { localStorage.setItem(LS, JSON.stringify(a)); return true; } catch(e){ return false; } };

function mergeAdds(){
  DATA.forEach(c => { c.l = c.l.filter(p => !p.mine); });
  loadAdds().forEach(p => {
    const c = DATA.find(x => x.s === p.s);
    if(!c) return;
    c.l.push({ n:p.n, d:p.d||'', lat:p.lat, lng:p.lng, k:fold((p.n+' '+(p.d||''))), mine:true, id:p.id });
  });
  DATA.forEach(c => c.l.sort((a,b) => a.n.localeCompare(b.n, 'fr')));
}

/* Accepte un lien Google Maps, ou simplement "lat, lng" */
function coordsFrom(txt){
  if(!txt) return null;
  const pats = [/@(-?\d+\.\d+),(-?\d+\.\d+)/, /[?&]query=(-?\d+\.\d+),(-?\d+\.\d+)/,
                /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/, /(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/];
  for(const re of pats){
    const m = txt.match(re);
    if(m){
      let lat = parseFloat(m[1]), lng = parseFloat(m[2]);
      /* La Réunion : latitude ~ -21, longitude ~ 55. Si c'est inversé, on remet d'aplomb. */
      if(lat > 50 && lng < 0){ const t = lat; lat = lng; lng = t; }
      if(isFinite(lat) && isFinite(lng)) return { lat:+lat.toFixed(6), lng:+lng.toFixed(6) };
    }
  }
  return null;
}
const dansLIle = c => c.lat > -21.5 && c.lat < -20.7 && c.lng > 55.1 && c.lng < 55.95;

function renderAdd(){
  document.body.dataset.view = 'list';
  const opts = DATA.map(c => `<option value="${c.s}">${esc(c.t)}</option>`).join('');
  app.innerHTML = `
    <div class="bar"><a class="back" href="#/">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H6M12 6l-6 6 6 6"/></svg>
      Tous les endroits</a></div>
    <div class="head"><h2>Ajouter un endroit</h2></div>
    <p class="note">L'endroit est enregistré <strong>dans ce téléphone</strong>. Il apparaîtra dans sa catégorie, avec les autres. Pour qu'il arrive aussi sur les autres téléphones, envoyez-le à Vincent depuis « Mes ajouts ».</p>
    <form class="form" id="fadd" novalidate>
      <label><span class="lb">Nom de l'endroit</span>
        <input type="text" id="f-n" required autocomplete="off" placeholder="Boulangerie du port"></label>
      <label><span class="lb">Catégorie</span>
        <select id="f-c">${opts}</select></label>
      <label><span class="lb">Description <span class="hint">Facultatif — ce qui aide à s'en souvenir.</span></span>
        <textarea id="f-d" placeholder="Bon pain, ouvert le dimanche matin."></textarea></label>
      <span class="lb">Où est-ce ?</span>
      <button type="button" class="gps" id="f-gps">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
        Je suis sur place, prendre ma position</button>
      <p class="or">ou collez un lien Google Maps</p>
      <label><input type="text" id="f-u" autocomplete="off" placeholder="https://maps.google.com/…" inputmode="url"></label>
      <output class="pos" id="f-p">Aucune position pour l'instant.</output>
      <button type="submit" class="submit" id="f-s" disabled>Enregistrer l'endroit</button>
    </form>`;

  const el = id => document.getElementById(id);
  let pos = null;
  const setPos = (p, msg, cls) => {
    pos = p; const o = el('f-p');
    o.className = 'pos' + (cls ? ' ' + cls : '');
    o.textContent = msg;
    el('f-s').disabled = !(p && el('f-n').value.trim());
  };

  el('f-n').addEventListener('input', () => { el('f-s').disabled = !(pos && el('f-n').value.trim()); });

  el('f-u').addEventListener('input', e => {
    const v = e.target.value.trim();
    if(!v) return setPos(null, 'Aucune position pour l\'instant.');
    const c = coordsFrom(v);
    if(!c){
      const court = /goo\.gl|maps\.app|bit\.ly/.test(v);
      return setPos(null, court
        ? "Ce lien raccourci ne contient pas la position. Dans Google Maps, appuyez quelques secondes sur le lieu : ses coordonnées s'affichent en haut de l'écran. Copiez-les et collez-les ici."
        : "Pas de position dans ce texte. Collez un lien Google Maps, ou deux nombres séparés par une virgule.", 'ko');
    }
    setPos(c, dansLIle(c) ? `Position trouvée : ${c.lat}, ${c.lng}`
                          : `Position trouvée : ${c.lat}, ${c.lng} — attention, ce point n'est pas à La Réunion.`,
           dansLIle(c) ? 'ok' : 'ko');
  });

  el('f-gps').addEventListener('click', () => {
    if(!navigator.geolocation) return setPos(null, "Ce téléphone ne sait pas donner sa position.", 'ko');
    const b = el('f-gps'); b.disabled = true;
    setPos(null, 'Recherche de la position…');
    navigator.geolocation.getCurrentPosition(
      r => { b.disabled = false;
             const c = { lat:+r.coords.latitude.toFixed(6), lng:+r.coords.longitude.toFixed(6) };
             setPos(c, `Position prise ici : ${c.lat}, ${c.lng}`, 'ok'); },
      e => { b.disabled = false;
             setPos(null, e.code === 1 ? "Position refusée. Autorisez la localisation, ou collez un lien Google Maps."
                                       : "Position introuvable. Sortez à l'air libre, ou collez un lien Google Maps.", 'ko'); },
      { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
  });

  el('fadd').addEventListener('submit', e => {
    e.preventDefault();
    const n = el('f-n').value.trim();
    if(!n || !pos) return;
    const a = loadAdds();
    a.push({ id:'a' + Date.now(), n, d:el('f-d').value.trim(), s:el('f-c').value, lat:pos.lat, lng:pos.lng });
    if(!saveAdds(a)) return setPos(pos, "Enregistrement impossible : la mémoire du navigateur est pleine ou bloquée.", 'ko');
    mergeAdds();
    location.hash = '#/' + el('f-c').value;
  });
}

function renderMine(){
  document.body.dataset.view = 'list';
  const a = loadAdds();
  const rows = a.map(p => {
    const c = DATA.find(x => x.s === p.s);
    return `<li class="place" style="--c:${c ? c.col : '#666'}">
      <div style="display:flex;align-items:center;gap:14px;padding:14px 2px">
        <span class="rule"></span>
        <span class="body"><span class="n">${esc(p.n)}</span>
          ${p.d ? `<span class="d">${esc(p.d)}</span>` : ''}
          <span class="d cat-label">${c ? esc(c.t) : '—'}</span></span>
        <button class="del" data-id="${p.id}" aria-label="Supprimer ${esc(p.n)}">&times;</button>
      </div></li>`; }).join('');
  app.innerHTML = `
    <div class="bar"><a class="back" href="#/">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H6M12 6l-6 6 6 6"/></svg>
      Tous les endroits</a></div>
    <div class="head"><h2>Mes ajouts</h2></div>
    ${a.length
      ? `<p class="count">${a.length} endroit${a.length>1?'s':''} enregistré${a.length>1?'s':''} dans ce téléphone</p>
         <ul class="places">${rows}</ul>
         <button class="export" id="exp">Préparer l'envoi à Vincent</button>
         <textarea class="export-out" id="expout" hidden readonly aria-label="À envoyer à Vincent"></textarea>`
      : `<div class="empty"><strong>Aucun ajout pour l'instant</strong>
         Les endroits que vous ajoutez apparaîtront ici, et vous pourrez les envoyer à Vincent.</div>`}`;

  app.querySelectorAll('.del').forEach(b => b.addEventListener('click', () => {
    saveAdds(loadAdds().filter(x => x.id !== b.dataset.id));
    mergeAdds(); renderMine();
  }));
  const exp = document.getElementById('exp');
  if(exp) exp.addEventListener('click', () => {
    const t = document.getElementById('expout');
    t.hidden = false;
    t.value = JSON.stringify(loadAdds(), null, 1);
    t.select();
    try { navigator.clipboard.writeText(t.value); exp.textContent = 'Copié — collez-le dans un message à Vincent'; }
    catch(e){ exp.textContent = 'Sélectionnez le texte ci-dessous et copiez-le'; }
  });
}


function placeItem(p, cat, showCat){
  return `<li class="place" style="--c:${cat.col}"><a href="${mapsUrl(p)}" rel="noreferrer">
    <span class="rule"></span>
    <span class="body">
      <span class="n">${esc(p.n)}</span>
      ${p.d ? `<span class="d">${esc(p.d)}</span>` : ''}
      ${showCat ? `<span class="d cat-label">${esc(cat.t)}</span>` : ''}
      ${p.mine ? '<span class="mine">Ajouté par vous</span>' : ''}
    </span>
    <span class="go">Y aller <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span>
  </a></li>`;
}

function renderHome(){
  document.body.dataset.view = 'home';
  app.innerHTML = `<ul class="tiles">` + DATA.map((c,i) => {
    const wide = i === 0;
    return `<li><a class="tile ${wide?'tile--wide':''}" style="--c:${c.col}" href="#/${c.s}">
      ${svg(ICONS[c.s], wide?30:26)}
      <span class="${wide?'txt':''}">
        <span class="nm">${esc(c.t)}</span>
        <span class="sb">${esc(c.sub)}</span>
      </span>
      <span class="ct">${c.l.length}</span>
    </a></li>`;
  }).join('') + `</ul>
    <button class="addbtn" type="button" onclick="location.hash='#/ajouter'">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Ajouter un endroit</button>` +
    (loadAdds().length ? `<button class="addbtn" type="button" onclick="location.hash='#/mesajouts'">Mes ajouts (${loadAdds().length})</button>` : '');
}

function renderCat(slug){
  const c = DATA.find(x => x.s === slug);
  if(!c) return renderHome();
  document.body.dataset.view = 'list';
  app.innerHTML = `
    <div class="bar"><a class="back" href="#/">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H6M12 6l-6 6 6 6"/></svg>
      Tous les endroits</a></div>
    <div class="head" style="--c:${c.col}"><span class="chip">${svg(ICONS[c.s],24)}</span><h2>${esc(c.t)}</h2></div>
    <p class="count">${c.l.length} endroits · ${esc(c.sub)}</p>
    <ul class="places">${c.l.map(p => placeItem(p, c, false)).join('')}</ul>`;
}

function renderSearch(term){
  document.body.dataset.view = 'list';
  const t = fold(term.trim());
  const hits = [];
  DATA.forEach(c => c.l.forEach(p => { if(p.k.includes(t)) hits.push([p,c]); }));
  if(!hits.length){
    app.innerHTML = `<div class="empty"><strong>Rien trouvé pour « ${esc(term)} »</strong>
      Essayez un mot plus court, ou revenez aux catégories en effaçant la recherche.</div>`;
    return;
  }
  app.innerHTML = `<p class="count">${hits.length} résultat${hits.length>1?'s':''}</p>
    <ul class="places">${hits.map(([p,c]) => placeItem(p, c, true)).join('')}</ul>`;
}

function route(){
  if(q.value.trim()){ renderSearch(q.value); return; }
  const m = location.hash.match(/^#\/(.+)$/);
  if(!m) return renderHome();
  if(m[1] === 'ajouter') return renderAdd();
  if(m[1] === 'mesajouts') return renderMine();
  renderCat(m[1]);
}

mergeAdds();

q.addEventListener('input', () => {
  clearBtn.hidden = !q.value;
  route();
});
clearBtn.addEventListener('click', () => { q.value=''; clearBtn.hidden=true; q.focus(); route(); });
window.addEventListener('hashchange', () => { route(); window.scrollTo(0,0); });
route();

if('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
</script>
</body>
</html>
